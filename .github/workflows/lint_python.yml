name: Lint Python Script

on:
  push:
    paths:
      - "spotify_to_apple_music.py"
  pull_request:
    paths:
      - "spotify_to_apple_music.py"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff — lint & format check
        run: |
          ruff check spotify_to_apple_music.py
          ruff format --check spotify_to_apple_music.py

      - name: Mypy — type check
        run: mypy spotify_to_apple_music.py --ignore-missing-imports
